<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      var h = document.documentElement, q = null, s = null, l;
      try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
      try { s = localStorage.getItem('kusoof.locale'); } catch (e) {}
      l = q === 'ar' || q === 'en' ? q : s === 'ar' || s === 'en' ? s : ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
      if (q) { try { localStorage.setItem('kusoof.locale', l); } catch (e) {} }
      h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
      if (l === 'ar') h.classList.add('i18n-pending');
    })();
  </script>
  <title>Verify your email — KUSOOF</title>
  <meta name="description" content="Enter the code we emailed you." />
  <meta name="theme-color" content="#FEFEFE" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="logo/kusoof-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/base.css?v=12" />
  <link rel="stylesheet" href="css/auth.css?v=11" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
  <header class="site-header"></header>

  <main id="main" tabindex="-1">
    <section class="auth">
      <div class="auth__backdrop" aria-hidden="true">
        <img src="products/mobile/black-wayfarer-optical-960.webp" alt="" />
        <img src="products/mobile/black-wayfarer-sun-960.webp" alt="" />
      </div>

      <div class="auth__wrap">
        <div class="glass-card otp" id="otp" data-state="idle">
          <!-- Step 1: enter the code -->
          <div class="otp__view" data-view="code">
            <div class="glass-card__icon" data-icon="mail"><span class="dot" aria-hidden="true"></span></div>
            <h1 class="glass-card__title" data-i18n="verify.title"></h1>
            <p class="glass-card__sub">
              <span data-sub></span><br />
              <span data-i18n="verify.to"></span> <span class="email-pill" data-email></span>
            </p>

            <form id="otp-form" novalidate>
              <div class="otp__boxes" role="group" data-i18n-attr="aria-label:verify.group" aria-describedby="otp-error">
                <svg class="otp__x" aria-hidden="true"><line /><line /></svg>
                <span class="otp__check" aria-hidden="true"></span>
              </div>
              <p class="otp__error" id="otp-error" role="alert"></p>
              <button class="btn btn--solid otp__verify" type="submit" disabled><span class="btn__label" data-i18n="verify.verify"></span></button>
            </form>

            <p class="otp__resend" aria-live="polite">
              <span data-i18n="verify.didntGet" style="color: inherit; font-weight: 400"></span>
              <span data-countdown></span>
              <button type="button" data-resend hidden></button>
            </p>
            <a class="otp__change" href="account.html" data-i18n="verify.changeEmail"></a>
          </div>

          <!-- Step 2: verified -->
          <div class="otp__view" data-view="success" hidden>
            <div class="otp__halo" data-icon="check"></div>
            <h2 class="glass-card__title" data-i18n="verify.successTitle" tabindex="-1"></h2>
            <p class="glass-card__sub" data-i18n="verify.successBody"></p>
            <div class="otp__rows">
              <div class="otp__row">
                <span class="otp__row-icon" data-icon="mail-sm"></span>
                <div><strong data-i18n="verify.rowEmail"></strong><small data-row-email dir="ltr"></small></div>
                <span class="otp__row-ok" data-icon="ok"></span>
              </div>
            </div>
            <a class="btn btn--solid otp__continue" data-continue href="account.html"></a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="js/pages/verify.js?v=9"></script>
</body>
</html>
