<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      var h = document.documentElement, q = null, s = null, l;
      try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
      try { s = localStorage.getItem('kusoof.locale'); } catch (e) {}
      l = q === 'ar' || q === 'en' ? q : s === 'ar' || s === 'en' ? s : ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
      if (q) { try { localStorage.setItem('kusoof.locale', l); } catch (e) {} }
      h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
      if (l === 'ar') h.classList.add('i18n-pending');
    })();
  </script>
  <title>Products — KUSOOF</title>
  <meta name="description" content="Discover KUSOOF eyewear: the Classic Black Sunglasses and Classic Black Optical Glasses." />
  <meta name="theme-color" content="#FEFEFE" />
  <meta property="og:image" content="products/black-wayfarer-sun.png" />
  <link rel="icon" type="image/png" href="logo/kusoof-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/base.css?v=12" />
  <link rel="stylesheet" href="css/products.css?v=9" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
  <header class="site-header"></header>

  <main id="main" tabindex="-1">
    <section class="collection-hero" aria-labelledby="collection-title">
      <p class="eyebrow" data-i18n="products.eyebrow">Our Collection</p>
      <h1 class="collection-hero__title" id="collection-title" data-i18n-html="products.title">Discover Our <em>Eyewear</em></h1>
      <p class="collection-hero__sub" data-i18n="products.sub">Timeless design. Exceptional quality. Made for your everyday style.</p>
    </section>

    <section class="collection" data-i18n-attr="aria-label:products.aria" aria-label="Products">
      <div class="collection__bar">
        <span data-collection-count></span>
        <span data-i18n="products.finish">Gloss Black</span>
      </div>
      <div class="product-grid" id="product-grid" aria-busy="true">
        <div class="skeleton" style="aspect-ratio: 4 / 4.2"></div>
        <div class="skeleton" style="aspect-ratio: 4 / 4.2"></div>
      </div>
      <noscript><p class="collection__noscript">Please enable JavaScript to view the collection.</p></noscript>
    </section>

    <section class="story" aria-label="KUSOOF">
      <p class="eyebrow" data-i18n="products.storyEyebrow">The craft</p>
      <a class="story__link" href="index.html">
        <span data-i18n-html="products.storyLink">See every detail <em>come together</em></span>
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="module" src="js/pages/products.js?v=9"></script>
</body>
</html>
