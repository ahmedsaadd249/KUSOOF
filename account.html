<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      var h = document.documentElement, q = null, s = null, l;
      try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
      try { s = localStorage.getItem('kusoof.locale'); } catch (e) {}
      l = q === 'ar' || q === 'en' ? q : s === 'ar' || s === 'en' ? s : ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
      if (q) { try { localStorage.setItem('kusoof.locale', l); } catch (e) {} }
      h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
      if (l === 'ar') h.classList.add('i18n-pending');
    })();
  </script>
  <title>Account — KUSOOF</title>
  <meta name="description" content="Create your KUSOOF account or sign in." />
  <meta name="theme-color" content="#FEFEFE" />
  <link rel="icon" type="image/png" href="logo/kusoof-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/base.css?v=12" />
  <link rel="stylesheet" href="css/auth.css?v=12" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
  <header class="site-header"></header>

  <main id="main" tabindex="-1">
    <!-- Signed out: create account / sign in -->
    <section class="auth" id="auth" hidden>
      <div class="auth__backdrop" aria-hidden="true">
        <img src="products/mobile/black-wayfarer-optical-960.webp" alt="" />
        <img src="products/mobile/black-wayfarer-sun-960.webp" alt="" />
      </div>
      <div class="auth__wrap">
        <div class="glass-card">
          <div class="glass-card__icon" data-icon="user"></div>
          <p class="auth-gate" id="auth-gate" role="status" hidden data-i18n="account.gate"></p>

          <div class="auth-tabs" role="tablist" data-i18n-attr="aria-label:account.tabs" data-active="create">
            <button type="button" role="tab" id="tab-create" aria-controls="form-create" aria-selected="true" data-tab="create" data-i18n="account.tabCreate"></button>
            <button type="button" role="tab" id="tab-signin" aria-controls="form-signin" aria-selected="false" tabindex="-1" data-tab="signin" data-i18n="account.tabSignin"></button>
            <span class="auth-tabs__ink" aria-hidden="true"></span>
          </div>

          <!-- Create account -->
          <form class="auth-form" id="form-create" role="tabpanel" aria-labelledby="tab-create" novalidate>
            <div>
              <h1 class="glass-card__title" data-i18n-html="account.createTitle"></h1>
              <p class="glass-card__sub" data-i18n="account.createSub"></p>
            </div>
            <p class="form-summary" role="alert" hidden></p>

            <div class="field">
              <label class="field__label" for="reg-name"><span data-i18n="account.fullName"></span></label>
              <input class="input" id="reg-name" name="name" type="text" autocomplete="name" aria-describedby="name-error" />
              <p class="field__error" id="name-error" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="reg-email"><span data-i18n="account.email"></span></label>
              <input class="input" id="reg-email" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" aria-describedby="email-error" />
              <p class="field__error" id="email-error" hidden></p>
            </div>

            <button class="btn btn--solid btn--block" type="submit"><span class="btn__label" data-i18n="account.submitCreate"></span></button>
            <p class="auth-note" data-code-note></p>
          </form>

          <!-- Sign in -->
          <form class="auth-form" id="form-signin" role="tabpanel" aria-labelledby="tab-signin" novalidate hidden>
            <div>
              <h1 class="glass-card__title" data-i18n-html="account.signinTitle"></h1>
              <p class="glass-card__sub" data-i18n="account.signinSub"></p>
            </div>
            <p class="form-summary" role="alert" hidden></p>
            <div class="field">
              <label class="field__label" for="in-email"><span data-i18n="account.email"></span></label>
              <input class="input" id="in-email" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" aria-describedby="in-email-error" />
              <p class="field__error" id="in-email-error" hidden></p>
            </div>
            <button class="btn btn--solid btn--block" type="submit"><span class="btn__label" data-i18n="account.submitSignin"></span></button>
            <p class="auth-note" data-code-note></p>
          </form>
        </div>
      </div>
    </section>

    <!-- Signed in: overview -->
    <section class="account" id="account" hidden>
      <header class="account__head">
        <p class="eyebrow" data-i18n="account.profile"></p>
        <h1 class="account__title display" id="account-hello"></h1>
      </header>
      <div class="account__grid">
        <aside class="account-card" id="account-card"></aside>
        <section aria-labelledby="orders-title">
          <h2 class="orders-list__title" id="orders-title" data-i18n="account.yourOrders"></h2>
          <div id="orders-list" aria-busy="true"><div class="skeleton" style="height: 64px"></div></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="module" src="js/pages/account.js?v=10"></script>
</body>
</html>
