<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      var h = document.documentElement, q = null, s = null, l;
      try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
      try { s = localStorage.getItem('kusoof.locale'); } catch (e) {}
      l = q === 'ar' || q === 'en' ? q : s === 'ar' || s === 'en' ? s : ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
      if (q) { try { localStorage.setItem('kusoof.locale', l); } catch (e) {} }
      h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
      if (l === 'ar') h.classList.add('i18n-pending');
    })();
  </script>
  <title>Product — KUSOOF</title>
  <meta name="description" content="KUSOOF eyewear product details." />
  <meta name="theme-color" content="#FEFEFE" />
  <link rel="icon" type="image/png" href="logo/kusoof-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/base.css?v=12" />
  <link rel="stylesheet" href="css/products.css?v=9" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
  <header class="site-header"></header>

  <main id="main" class="pdp-main" tabindex="-1">
    <nav class="breadcrumb" data-i18n-attr="aria-label:product.breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="products.html" data-i18n="nav.products">Products</a></li>
        <li aria-current="page" data-crumb></li>
      </ol>
    </nav>

    <!-- Filled by js/pages/product.js -->
    <div id="pdp" aria-busy="true">
      <div class="pdp">
        <div class="skeleton" style="aspect-ratio: 4 / 3"></div>
        <div>
          <div class="skeleton" style="height: 18px; width: 30%"></div>
          <div class="skeleton" style="height: 64px; margin-top: 18px"></div>
          <div class="skeleton" style="height: 120px; margin-top: 24px"></div>
        </div>
      </div>
    </div>

    <section class="related" id="related" aria-labelledby="related-title" hidden>
      <div class="related__head">
        <p class="eyebrow" data-i18n="product.relatedEyebrow">Our Collection</p>
        <h2 class="related__title" id="related-title" data-i18n-html="product.related">Also in the <em>collection</em></h2>
      </div>
      <div class="product-grid product-grid--single" id="related-grid"></div>
    </section>

    <section class="not-found" id="not-found" hidden>
      <p class="eyebrow" data-i18n="product.notFoundEyebrow">Not found</p>
      <h1 data-i18n="product.notFoundTitle">This piece isn’t in the collection.</h1>
      <p data-i18n="product.notFoundBody">It may have moved, or the link is incomplete.</p>
      <a class="btn btn--outline" href="products.html"><span data-i18n="product.back">Back to Products</span></a>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="module" src="js/pages/product.js?v=9"></script>
</body>
</html>
